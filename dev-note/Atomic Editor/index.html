<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atomic Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0d0d10',
          bg2: '#12121a',
          surface: '#1a1a24',
          elev: '#202030',
          accent: '#3858e9',
        },
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
      }
    }
  }
</script>
<style>
  html, body, #root { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0d0d10;
    color: #e7e7ee;
    font-feature-settings: 'cv11','ss01','ss03';
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.12); }

  .hairline { box-shadow: 0 0 0 1px rgba(255,255,255,0.04); }
  .hairline-strong { box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }

  .checker {
    background-image:
      linear-gradient(45deg, rgba(255,255,255,0.04) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(255,255,255,0.04) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.04) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.04) 75%);
    background-size: 12px 12px;
    background-position: 0 0, 0 6px, 6px -6px, -6px 0;
  }

  .canvas-bg {
    background:
      radial-gradient(circle at 20% 0%, rgba(56,88,233,0.06), transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(56,88,233,0.04), transparent 50%),
      #0a0a0e;
  }

  .grid-floor {
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: -1px -1px;
  }

  .ring-accent { box-shadow: 0 0 0 1px rgba(56,88,233,0.55), 0 0 0 4px rgba(56,88,233,0.12); }

  .glow-accent { box-shadow: 0 8px 24px -8px rgba(56,88,233,0.6), 0 0 0 1px rgba(56,88,233,0.3) inset; }

  .floating-tb {
    background: rgba(20, 20, 28, 0.78);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 20px 40px -20px rgba(0,0,0,0.8),
      0 4px 12px -4px rgba(0,0,0,0.6);
  }

  .palette-glass {
    background: rgba(18, 18, 26, 0.86);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 40px 80px -20px rgba(0,0,0,0.7);
  }

  /* Range slider */
  input[type="range"].atomic {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    outline: none;
  }
  input[type="range"].atomic::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 999px;
    border: 3px solid #3858e9;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  input[type="range"].atomic::-moz-range-thumb {
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 999px;
    border: 3px solid #3858e9;
    cursor: pointer;
  }

  .toggle-on {
    background: #3858e9;
  }
  .toggle-on .knob { transform: translateX(14px); }

  .block-card:hover .block-icon {
    color: #3858e9;
  }
  .block-card:hover {
    background: #202030 !important;
    border-color: rgba(56,88,233,0.55) !important;
  }

  .seg-active {
    background: #2a2a3c;
    color: #fff;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 1px 0 rgba(0,0,0,0.3);
  }

  .kbd {
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    padding: 2px 6px;
    border-radius: 5px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.06);
    color: #b8b8c8;
    line-height: 1;
  }

  .anim-pop {
    animation: pop 180ms cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(-4px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .anim-fade { animation: fade 180ms ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .marquee { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
